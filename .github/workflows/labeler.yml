name: Labeler
on: [workflow_dispatch]
permissions:
  contents: read
  pull-requests: write
jobs:
  labeler:
    name: Labeler
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Try label from title
        uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        with:
          configuration-path: .github/labeler.yml
          not-before: 2026-10-3T00:00:00Z
          enable-versioned-regex: 0
          include-title: 1
          sync-labels: 0
          repo-token: ${{ github.token }}
  labeler-fallback:
    name: Labeler (Fallback)
    needs: labeler
    if: ${{ always() && needs.labeler.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Try label using fallback
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler-fallback.yml
          sync-labels: false
          repo-token: ${{ github.token }}
