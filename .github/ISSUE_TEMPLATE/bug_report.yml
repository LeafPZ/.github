name: Bug report
description: Something isn't working as expected
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: 'Thanks for taking the time to create the report! Please fill out the fields below.'
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: 'I searched existing issues and didn''t find a duplicate'
          required: true
        - label: 'The issue''s contents weren''t generated by AI'
          required: true
        - label: 'The issue''s contents are in a language I can understand'
          required: true
  - type: input
    id: version
    attributes:
      label: 'Version'
      placeholder: 'e.g. 2.4.1 or None'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Do ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or any other media
      render: shell
